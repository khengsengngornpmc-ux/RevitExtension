name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Revit extension design-time validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Revit version support
        shell: pwsh
        run: .\scripts\verify-revit-version-support.ps1 -DesignTimeBuild

      - name: Build deploy EXEs
        shell: pwsh
        run: .\scripts\build-deploy-exe-all-revit.ps1
